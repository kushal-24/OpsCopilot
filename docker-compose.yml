services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      # Inside the compose network, containers reach each other by service name.
      CHROMA_URL: http://chroma:8000
    depends_on:
      - chroma

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    stdin_open: true
    tty: true
  
  postgres:
    image: postgres:17
    container_name: opscopilot-postgres
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
  chroma:
    image: chromadb/chroma
    container_name: opscopilot-chroma
    restart: always
    ports:
      # host:container - lets you hit Chroma from your Mac at localhost:8000
      - "8000:8000"
    volumes:
      # Persist vectors across restarts (Chroma stores data in /data)
      - chroma_data:/data

volumes:
  postgres_data:
  chroma_data: